<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>drain</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #0a0a0a;
      --card: rgba(20, 20, 20, 0.75);
      --border: rgba(255, 255, 255, 0.1);
      --border-hover: rgba(255, 255, 255, 0.45);
      --text: #f5f5f5;
      --text-dim: #8a8a8a;
    }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      background: var(--bg);
      color: var(--text);
      position: relative;
      overflow-x: hidden;
    }

    .video-bg {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      z-index: -2;
      filter: grayscale(100%) brightness(0.45);
    }
    .video-overlay {
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse at center, rgba(10, 10, 10, 0.35), rgba(10, 10, 10, 0.85)),
        rgba(10, 10, 10, 0.4);
      z-index: -1;
      pointer-events: none;
    }

    .card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 420px;
      text-align: center;
      background: var(--card);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 40px 28px;
      box-shadow:
        0 20px 60px rgba(0, 0, 0, 0.7),
        inset 0 1px 0 rgba(255, 255, 255, 0.05);
      animation: appear 0.6s ease-out;
    }
    @keyframes appear {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .avatar {
      width: 110px; height: 110px;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.25);
      box-shadow: 0 0 30px rgba(255, 255, 255, 0.15);
      object-fit: cover;
      margin-bottom: 18px;
      transition: transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease;
    }
    .avatar:hover {
      transform: scale(1.05);
      border-color: rgba(255, 255, 255, 0.6);
      box-shadow: 0 0 40px rgba(255, 255, 255, 0.3);
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 6px;
      background: linear-gradient(135deg, #ffffff 0%, #999999 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: 0.5px;
    }

    .bio {
      font-size: 1rem;
      color: #e8e8e8;
      margin-bottom: 22px;
      line-height: 1.5;
      letter-spacing: 0.5px;
      font-style: italic;
      text-shadow:
        0 0 6px rgba(255, 255, 255, 0.9),
        0 0 14px rgba(255, 255, 255, 0.7),
        0 0 28px rgba(255, 255, 255, 0.5),
        0 0 48px rgba(255, 255, 255, 0.3);
      animation: glow-pulse 3s ease-in-out infinite;
    }
    @keyframes glow-pulse {
      0%, 100% {
        text-shadow:
          0 0 6px rgba(255, 255, 255, 0.9),
          0 0 14px rgba(255, 255, 255, 0.7),
          0 0 28px rgba(255, 255, 255, 0.5),
          0 0 48px rgba(255, 255, 255, 0.3);
      }
      50% {
        text-shadow:
          0 0 8px rgba(255, 255, 255, 1),
          0 0 20px rgba(255, 255, 255, 0.9),
          0 0 38px rgba(255, 255, 255, 0.7),
          0 0 64px rgba(255, 255, 255, 0.5);
      }
    }

    .player {
      margin-bottom: 22px;
      padding: 16px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border);
      border-radius: 16px;
      text-align: left;
    }

    .player-title {
      font-size: 0.78rem;
      color: var(--text-dim);
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    .now-playing {
      font-size: 0.95rem;
      font-weight: 600;
      color: #fff;
      margin-bottom: 14px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      min-height: 1.3em;
    }

    .player-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .ctrl-btn {
      width: 38px; height: 38px;
      flex-shrink: 0;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: rgba(255, 255, 255, 0.04);
      color: #fff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.25s ease;
    }
    .ctrl-btn:hover {
      background: rgba(255, 255, 255, 0.12);
      border-color: rgba(255, 255, 255, 0.5);
    }
    .ctrl-btn svg { width: 16px; height: 16px; }

    .play-btn {
      width: 44px; height: 44px;
      border-color: rgba(255, 255, 255, 0.25);
      background: rgba(255, 255, 255, 0.06);
    }
    .play-btn:hover {
      box-shadow: 0 0 20px rgba(255, 255, 255, 0.15);
    }
    .play-btn svg { width: 20px; height: 20px; }

    .progress-wrap {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .progress-bar {
      position: relative;
      height: 6px;
      background: rgba(255, 255, 255, 0.12);
      border-radius: 3px;
      cursor: pointer;
      overflow: hidden;
    }
    .progress-fill {
      position: absolute;
      top: 0; left: 0;
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #ffffff, #999999);
      border-radius: 3px;
      transition: width 0.1s linear;
    }

    .time-row {
      display: flex;
      justify-content: space-between;
      font-size: 0.72rem;
      color: var(--text-dim);
      font-variant-numeric: tabular-nums;
    }

    .volume-btn {
      width: 32px; height: 32px;
      flex-shrink: 0;
      border: none;
      background: transparent;
      color: var(--text-dim);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color 0.25s ease;
    }
    .volume-btn:hover { color: #fff; }
    .volume-btn svg { width: 18px; height: 18px; }

    .volume-bar {
      width: 50px;
      height: 4px;
      background: rgba(255, 255, 255, 0.12);
      border-radius: 2px;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      flex-shrink: 0;
    }
    .volume-fill {
      position: absolute;
      top: 0; left: 0;
      height: 100%;
      width: 70%;
      background: rgba(255, 255, 255, 0.7);
      border-radius: 2px;
    }

    .links {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 14px;
      margin-top: 8px;
    }

    .link {
      width: 56px;
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border);
      border-radius: 50%;
      color: #d4d4d4;
      text-decoration: none;
      transition: all 0.25s ease;
      position: relative;
    }

    .link:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: var(--border-hover);
      color: #ffffff;
      transform: translateY(-3px) scale(1.05);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6), 0 0 20px rgba(255, 255, 255, 0.15);
    }

    .link svg {
      width: 24px;
      height: 24px;
      transition: transform 0.25s ease;
    }

    .link:hover svg {
      transform: scale(1.15);
    }

    @media (max-width: 480px) {
      .link { width: 50px; height: 50px; }
      .link svg { width: 22px; height: 22px; }
      .links { gap: 12px; }
    }

    .footer {
      margin-top: 28px;
      font-size: 0.78rem;
      color: var(--text-dim);
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    @media (prefers-reduced-motion: reduce) {
      .video-bg { display: none; }
      body {
        background-image:
          radial-gradient(ellipse at top, rgba(255, 255, 255, 0.06), transparent 60%),
          radial-gradient(ellipse at bottom, rgba(255, 255, 255, 0.04), transparent 60%);
      }
      .bio { animation: none; }
    }
  </style>

  <script>
    const tracks = [
      { title: 'nuts — lil peep, rainy bear', src: 'music/track1.mp3' },
      { title: 'пунктир — вышел покурить',    src: 'music/track2.mp3' },
      { title: 'я схавал опиат — CUPSIZE',    src: 'music/track3.mp3' }
    ];

    const audio = document.getElementById('audio');
    const playBtn = document.getElementById('playBtn');
    const playIcon = document.getElementById('playIcon');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const progressBar = document.getElementById('progressBar');
    const progressFill = document.getElementById('progressFill');
    const currentTimeEl = document.getElementById('currentTime');
    const durationEl = document.getElementById('duration');
    const volumeBtn = document.getElementById('volumeBtn');
    const volumeBar = document.getElementById('volumeBar');
    const volumeFill = document.getElementById('volumeFill');
    const nowPlaying = document.getElementById('nowPlaying');

    const iconPlay = '<path d="M8 5v14l11-7z"/>';
    const iconPause = '<path d="M6 5h4v14H6zm8 0h4v14h-4z"/>';

    let currentIndex = 0;

    function formatTime(sec) {
      if (isNaN(sec)) return '0:00';
      const m = Math.floor(sec / 60);
      const s = Math.floor(sec % 60).toString().padStart(2, '0');
      return `${m}:${s}`;
    }

    function playTrack(index) {
      currentIndex = (index + tracks.length) % tracks.length;
      const track = tracks[currentIndex];
      audio.src = track.src;
      nowPlaying.textContent = track.title;
      audio.play().catch(() => {});
    }

    playBtn.addEventListener('click', () => {
      if (!audio.src) {
        playTrack(0);
        return;
      }
      if (audio.paused) {
        audio.play();
      } else {
        audio.pause();
      }
    });

    prevBtn.addEventListener('click', () => playTrack(currentIndex - 1));
    nextBtn.addEventListener('click', () => playTrack(currentIndex + 1));

    audio.addEventListener('play', () => {
      playIcon.innerHTML = iconPause;
      playBtn.setAttribute('aria-label', 'Pause');
    });
    audio.addEventListener('pause', () => {
      playIcon.innerHTML = iconPlay;
      playBtn.setAttribute('aria-label', 'Play');
    });

    audio.addEventListener('loadedmetadata', () => {
      durationEl.textContent = formatTime(audio.duration);
    });
    audio.addEventListener('timeupdate', () => {
      const pct = (audio.currentTime / audio.duration) * 100 || 0;
      progressFill.style.width = pct + '%';
      currentTimeEl.textContent = formatTime(audio.currentTime);
    });

    audio.addEventListener('ended', () => {
      playTrack(currentIndex + 1);
    });

    progressBar.addEventListener('click', (e) => {
      const rect = progressBar.getBoundingClientRect();
      const pct = (e.clientX - rect.left) / rect.width;
      if (audio.duration) audio.currentTime = pct * audio.duration;
    });

    volumeBar.addEventListener('click', (e) => {
      const rect = volumeBar.getBoundingClientRect();
      const vol = Math.min(Math.max((e.clientX - rect.left) / rect.width, 0), 1);
      audio.volume = vol;
      volumeFill.style.width = (vol * 100) + '%';
      audio.muted = vol === 0;
    });
    volumeBtn.addEventListener('click', () => {
      audio.muted = !audio.muted;
      volumeFill.style.width = audio.muted ? '0%' : (audio.volume * 100) + '%';
    });

    /* === АВТОЗАПУСК С ТИХОЙ ГРОМКОСТЬЮ === */
    audio.volume = 0.25;
    volumeFill.style.width = '25%';
    nowPlaying.textContent = tracks[0].title;
    audio.src = tracks[0].src;

    let started = false;

    function startMusic() {
      if (started) return;
      const p = audio.play();
      if (p !== undefined) {
        p.then(() => {
          started = true;
        }).catch(() => {
          // браузер ещё не разрешил — ждём действия
        });
      }
    }

    // Попытка №1: сразу
    startMusic();

    // Попытка №2: после полной загрузки страницы
    window.addEventListener('load', startMusic);

    // Попытка №3: при любом действии пользователя
    ['click', 'touchstart', 'keydown', 'scroll', 'mousemove'].forEach(evt => {
      document.addEventListener(evt, startMusic, { once: true, passive: true });
    });
  </script>
