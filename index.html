<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>drain</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      background: #0a0a0a;
      color: #f5f5f5;
      position: relative;
      overflow-x: hidden;
      -webkit-tap-highlight-color: transparent;
    }

    /* Фон */
    .bg-video {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      z-index: -2;
      filter: grayscale(100%) brightness(0.4);
    }
    .bg-overlay {
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse at center, rgba(10, 10, 10, 0.3), rgba(10, 10, 10, 0.9));
      z-index: -1;
      pointer-events: none;
    }

    /* Карточка */
    .card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 420px;
      text-align: center;
      background: rgba(20, 20, 20, 0.8);
      backdrop-filter: blur(15px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 35px 25px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8);
      animation: fadeUp 0.5s ease-out;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(15px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .avatar {
      width: 110px; height: 110px;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.2);
      box-shadow: 0 0 20px rgba(255, 255, 255, 0.1);
      object-fit: cover;
      margin-bottom: 15px;
      transition: 0.3s;
    }
    .avatar:hover {
      transform: scale(1.03);
      border-color: rgba(255, 255, 255, 0.5);
    }

    h1 {
      font-size: 1.5rem;
      margin-bottom: 5px;
      background: linear-gradient(135deg, #fff, #888);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* Текст со свечением */
    .bio {
      font-size: 0.95rem;
      color: #ddd;
      margin-bottom: 25px;
      font-style: italic;
      text-shadow: 0 0 8px rgba(255, 255, 255, 0.8), 0 0 20px rgba(255, 255, 255, 0.4);
      animation: glow 3s infinite alternate;
    }
    @keyframes glow {
      0% { text-shadow: 0 0 8px rgba(255, 255, 255, 0.8), 0 0 20px rgba(255, 255, 255, 0.4); }
      100% { text-shadow: 0 0 12px rgba(255, 255, 255, 1), 0 0 30px rgba(255, 255, 255, 0.6); }
    }

    /* Плеер */
    .player {
      margin-bottom: 25px;
      padding: 15px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      text-align: left;
    }
    .player-label {
      font-size: 0.7rem;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 5px;
    }
    .track-name {
      font-size: 0.9rem;
      font-weight: 600;
      margin-bottom: 12px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    
    .btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #fff;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: 0.2s;
    }
    .btn:hover { background: rgba(255, 255, 255, 0.15); }
    
    .btn-sm { width: 36px; height: 36px; flex-shrink: 0; }
    .btn-sm svg { width: 14px; height: 14px; }
    
    .btn-play { width: 42px; height: 42px; flex-shrink: 0; }
    .btn-play svg { width: 18px; height: 18px; }

    .progress-area { flex: 1; display: flex; flex-direction: column; gap: 4px; }
    
    .progress-bg {
      height: 5px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 3px;
      cursor: pointer;
      position: relative;
      overflow: hidden;
    }
    .progress-fill {
      position: absolute;
      top: 0; left: 0; height: 100%; width: 0%;
      background: #fff;
      border-radius: 3px;
    }
    
    .time {
      display: flex;
      justify-content: space-between;
      font-size: 0.65rem;
      color: #888;
    }

    .vol-btn { border: none; background: none; color: #888; cursor: pointer; }
    .vol-btn:hover { color: #fff; }
    .vol-btn svg { width: 16px; height: 16px; }
    
    .vol-bg {
      width: 40px; height: 4px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 2px;
      cursor: pointer;
      position: relative;
    }
    .vol-fill {
      position: absolute; top: 0; left: 0; height: 100%; width: 25%;
      background: rgba(255, 255, 255, 0.6);
      border-radius: 2px;
    }

    /* Ссылки */
    .socials {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
    }
    .socials a {
      width: 55px; height: 55px;
      display: flex; align-items: center; justify-content: center;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 50%;
      color: #ccc;
      transition: 0.2s;
    }
    .socials a:hover, .socials a:active {
      color: #fff;
      background: rgba(255, 255, 255, 0.1);
      transform: translateY(-3px);
      border-color: rgba(255, 255, 255, 0.3);
    }
    .socials svg { width: 22px; height: 22px; }

    .footer {
      margin-top: 25px;
      font-size: 0.7rem;
      color: #555;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    /* Мобилки */
    @media (max-width: 480px) {
      .card { padding: 25px 15px; }
      .avatar { width: 90px; height: 90px; }
      h1 { font-size: 1.3rem; }
      .socials a { width: 48px; height: 48px; }
      .socials svg { width: 18px; height: 18px; }
      .progress-bg { height: 7px; }
      .bg-video { display: none; } /* видео на телефонах грузит трафик */
      body { background: radial-gradient(circle, #1a1a1a, #0a0a0a); }
    }

    /* Ландшафт на телефоне */
    @media (max-height: 500px) and (orientation: landscape) {
      .card { max-width: 600px; display: flex; flex-wrap: wrap; gap: 15px; text-align: left; }
      .top-part { flex: 1; }
      .player { flex: 1 1 100%; margin-bottom: 5px; }
      .socials { justify-content: flex-start; }
    }
  </style>
</head>

  <script>
    const tracks = [
      { name: 'nuts — lil peep, rainy bear', src: 'music/track1.mp3' },
      { name: 'пунктир — вышел покурить', src: 'music/track2.mp3' },
      { name: 'я схавал опиат — CUPSIZE', src: 'music/track3.mp3' }
    ];

    const audio = document.getElementById('audio');
    const playBtn = document.getElementById('playBtn');
    const playIcon = document.getElementById('playIcon');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const bar = document.getElementById('progressBar');
    const fill = document.getElementById('progressFill');
    const currT = document.getElementById('currentTime');
    const durT = document.getElementById('duration');
    const volBtn = document.getElementById('volumeBtn');
    const volBar = document.getElementById('volumeBar');
    const volFill = document.getElementById('volumeFill');
    const title = document.getElementById('nowPlaying');

    let idx = 0;

    function fmt(s) {
      if (isNaN(s)) return '0:00';
      let m = Math.floor(s / 60);
      let sec = Math.floor(s % 60).toString().padStart(2, '0');
      return m + ':' + sec;
    }

    function play(i) {
      idx = (i + tracks.length) % tracks.length;
      audio.src = tracks[idx].src;
      title.textContent = tracks[idx].name;
      audio.play().catch(() => {});
    }

    playBtn.onclick = () => {
      if (!audio.src) return play(0);
      audio.paused ? audio.play() : audio.pause();
    };

    prevBtn.onclick = () => play(idx - 1);
    nextBtn.onclick = () => play(idx + 1);

    audio.onplay = () => {
      playIcon.innerHTML = '<path d="M6 5h4v14H6zm8 0h4v14h-4z"/>';
    };
    audio.onpause = () => {
      playIcon.innerHTML = '<path d="M8 5v14l11-7z"/>';
    };

    audio.onloadedmetadata = () => {
      durT.textContent = fmt(audio.duration);
    };
    audio.ontimeupdate = () => {
      let p = (audio.currentTime / audio.duration) * 100 || 0;
      fill.style.width = p + '%';
      currT.textContent = fmt(audio.currentTime);
    };
    audio.onended = () => play(idx + 1);

    bar.onclick = (e) => {
      let r = bar.getBoundingClientRect();
      let p = (e.clientX - r.left) / r.width;
      if (audio.duration) audio.currentTime = p * audio.duration;
    };

    volBar.onclick = (e) => {
      let r = volBar.getBoundingClientRect();
      let v = Math.min(Math.max((e.clientX - r.left) / r.width, 0), 1);
      audio.volume = v;
      volFill.style.width = (v * 100) + '%';
      audio.muted = v === 0;
    };
    volBtn.onclick = () => {
      audio.muted = !audio.muted;
      volFill.style.width = audio.muted ? '0%' : (audio.volume * 100) + '%';
    };

    // Тихо включаем при заходе (браузеры могут блокировать)
    audio.volume = 0.25;
    volFill.style.width = '25%';
    title.textContent = tracks[0].name;
    audio.src = tracks[0].src;

    let started = false;
    function startAudio() {
      if (started) return;
      audio.play().then(() => started = true).catch(() => {});
    }

    startAudio();
    window.onload = startAudio;
    ['click', 'touchstart', 'scroll'].forEach(ev => {
      document.addEventListener(ev, startAudio, { once: true });
    });
  </script>
